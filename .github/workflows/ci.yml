# Серверное зеркало локальной лестницы хуков (CLAUDE.md §6).
# Husky-хуки обходятся `--no-verify`; этот workflow — обязательный гейт,
# который обойти нельзя (после включения branch protection на main).
#
#   checks — L1/L2: npm run verify (typecheck + lint + format:check + unit-слой)
#   gate   — L2.5/L3: scripts/gate.ts (migrate deploy → seed → test:integration)
#            против Postgres service-контейнера + prisma migrate status
#
# CI вызывает те же npm-скрипты, что и хуки, — не дублируй их шаги в YAML,
# иначе серверный и локальный гейты разъедутся.
#
# ─── Про стоимость (правка 18.09.2026) ──────────────────────────────────────
#
# Репозиторий приватный, аккаунт на бесплатном тарифе: 2000 минут Actions в
# месяц. Раньше один прогон стоил **27 минут** (замер по успешному прогону
# 12.09.2026), а на каждый PR приходилось ДВА прогона — на сам PR и на push в
# `main` после мержа. Итого ~54 минуты на PR, то есть квоты хватало на ~37 PR.
# Программа делает по 50+ PR в месяц, и 17.09.2026 в 18:30 минуты кончились:
# с этого момента КАЖДЫЙ прогон падает за 0 секунд со `startup_failure`, а
# владельцу идут письма «PR run failed at startup». Заметить причину по письму
# нельзя — GitHub пишет обтекаемое «likely a workflow file issue», хотя файл
# исправен (тот же файл работал за 24 минуты до этого, а ручной запуск
# принимается).
#
# Что сделано, чтобы это не повторилось:
#
#   1. **Тяжёлые работы запускаются только по делу.** Job `scope` смотрит, что
#      изменилось в PR, и включает `gate` только при правках базы и сервисов
#      (ровно как локальный `gate-precheck.ts`, §6 L2.5), `e2e` — только при
#      правках экранов, `build` — при правках кода, `audit` — при правках
#      зависимостей. Документационный PR стоит ~12 минут вместо 27.
#   2. **На `main` после мержа гоняется только `checks`.** Прогон PR проверил
#      РОВНО то же дерево минутами раньше: ветки берутся от свежего `main` и
#      вливаются сразу. Второй полный прогон стоил столько же и не проверял
#      ничего нового.
#   3. **У каждой работы есть предел времени.** Без него зависшая работа
#      крутится до 6 часов — это 18 % месячной квоты за один раз.
#
# Расчёт после правки: типичный PR этапа (код без экранов) ≈ 20 минут вместо
# 54 — квоты хватает примерно на 100 PR в месяц.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск: 13.08.2026 workflow был выключен в настройках репозитория
  # (`disabled_manually`) и пролежал так почти месяц — PR-ы уезжали в `main`
  # вообще без серверных проверок, хотя шапка этого файла и `CLAUDE.md` §6
  # называют его обязательным гейтом. Заметить это было нечем: отключённый
  # workflow не падает, он просто молчит. Кнопка «Run workflow» нужна, чтобы
  # состояние гейта можно было проверить в любой момент, не выдумывая пустой
  # коммит. Ручной запуск гоняет ВСЁ, без сокращений по изменённым файлам.
  workflow_dispatch:

# На PR-ветках новый push отменяет устаревший прогон; на main НЕ отменяем —
# иначе back-to-back мержи оставляют промежуточный коммит без CI-вердикта.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Что именно изменилось. Отдельной работой, а не сторонним экшеном: нужен
  # один `git diff`, ради которого не стоит заводить зависимость с правами на
  # репозиторий. Стоит ~30 секунд и экономит десятки минут на каждом PR.
  #
  # Если сравнивать не с чем (ручной запуск, новая ветка, force-push) —
  # включаем ВСЁ. Ошибиться в сторону «прогнать лишнее» дешевле, чем пропустить.
  scope:
    name: что менялось
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.what.outputs.code }}
      db: ${{ steps.what.outputs.db }}
      ui: ${{ steps.what.outputs.ui }}
      deps: ${{ steps.what.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: what
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          all() {
            echo "сравнивать не с чем — гоним всё"
            {
              echo "code=true"
              echo "db=true"
              echo "ui=true"
              echo "deps=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "${BASE:-}" ] || all
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || all

          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "Изменённые файлы:"
          echo "$files" | sed 's/^/  /'

          has() { echo "$files" | grep -qE "$1"; }

          # Код, от которого зависит сборка и типы.
          if has '^(src/|prisma/|scripts/|package(-lock)?\.json|next\.config\.mjs|tsconfig.*\.json|eslint\.config\.mjs|vitest\.config\.ts|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # База и то, что с ней работает, — тот же список, что у локального
          # `scripts/gate-precheck.ts` (CLAUDE.md §6, слой L2.5).
          if has '^(prisma/|src/lib/services/|src/worker/|src/lib/jobs/|scripts/gate)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi

          # Экраны: страницы, компоненты, навигация и правила приёмки.
          if has '^(src/app/|src/components/|src/lib/navigation/|src/lib/acceptance/|src/e2e/|playwright\.config\.ts)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

          if has '^package(-lock)?\.json$'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
          fi

  # Фаза 4: скан секретов. Работает по всей истории PR-диапазона; секретов в
  # репозитории нет (проверено аудитом) — job охраняет от будущих утечек.
  # Стоит секунды, поэтому по изменённым файлам не сокращается: утечка может
  # приехать в любом файле.
  gitleaks:
    name: gitleaks · скан секретов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'push'
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Бинарь напрямую (не gitleaks-action): экшену нужны API-права
      # (Resource not accessible by integration), бинарю — нет; локальный
      # запуск и CI используют одну и ту же команду и .gitleaks.toml.
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  # Фаза 7: прод-сборка ловит то, чего не видит typecheck (границы
  # server/client-компонентов, конфиг Next). Sentry без DSN — no-op.
  build:
    name: build · прод-сборка
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: scope
    if: github.event_name != 'push' && needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # Как у typecheck/lint: дефолтного heap на раннере не хватает (OOM).
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Фаза 7: критические уязвимости прод-зависимостей = красная сборка.
  # Порог critical (не high): текущие high — транзитивные без фиксов у
  # упаковщиков, их закрывает Renovate (см. docs/CI.md).
  audit:
    name: audit · критические уязвимости
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: github.event_name != 'push' && needs.scope.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical

  # Ядро гейта. На PR гоняется ВСЕГДА и по изменённым файлам не сокращается:
  # внутри живут доковые стражи (`docs.tz-program`, `docs.live-links`), и PR,
  # меняющий только документы, ломает ровно их.
  #
  # На `main` после мержа — только если менялся код. Документы к этому моменту
  # уже проверены прогоном самого PR на том же дереве; повторять ради них
  # двенадцать минут незачем.
  checks:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что в package.json engines.node.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # Фаза 1: единая команда локальной и серверной проверки.
      # verify = typecheck → lint → boundaries (dependency-cruiser) →
      #          deadcode (knip) → dup:check (jscpd ≤3%) →
      #          format:check → test:ci (unit).
      - run: npm run verify

  gate:
    name: integration gate · migrate status
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: scope
    if: github.event_name != 'push' && needs.scope.outputs.db == 'true'
    services:
      postgres:
        # Тот же образ и креды, что db-сервис в docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cabinet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cabinet
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cabinet
      # Явно, а не через совпадение с дефолтом gate.ts: gate подменяет
      # DATABASE_URL/DIRECT_URL на GATE_DATABASE_URL ?? <localhost:5432-дефолт>.
      GATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cabinet
      # Postgres предоставлен service-контейнером — gate не поднимает compose.
      GATE_SKIP_DOCKER: '1'
      # CI-only заглушки (не секреты): без .env модули читают env напрямую.
      # S3_ENDPOINT намеренно НЕ задан — S3 round-trip suite сам скипается
      # (describe.skipIf), ровно как в локальном gate без MinIO.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-32
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ONE_C_ADAPTER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # gate = prisma migrate deploy → prisma:seed → test:integration.
      # Отдельный шаг test:integration не нужен — он внутри gate.
      - run: npm run gate
      # История миграций консистентна: все применены, нет failed/missing.
      - run: npx prisma migrate status
      # Фаза 5: дрейф schema.prisma от каталога миграций (migrate status его
      # не ловит). Пустая shadow-БД на том же service-контейнере.
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres drift_shadow
      # Не голый `migrate diff --exit-code`: одно ограничение в базе Prisma
      # выразить не умеет (`ON DELETE SET NULL ("orderId")` у составного ключа
      # Document→Order). Скрипт держит поимённый список таких исключений с
      # причиной и падает на всём остальном — иначе пришлось бы выбирать между
      # вечно красным шагом и полным отказом от проверки дрейфа.
      - run: npm run schema:drift
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_shadow

  # Фаза 6 (08.09.2026): правила экранов в CI. До этого 480 браузерных
  # проверок гонялись только руками на стенде — регресс интерфейса мог
  # доехать до `main` незамеченным («задел на будущее» в STATUS.md).
  #
  # Гоняются СТРУКТУРНЫЕ проверки: заголовок совпадает с пунктом меню,
  # подзаголовок на месте, крошки у вложенных экранов, каркас на 390 px,
  # ошибки по-русски. Сравнение СКРИНШОТОВ сюда намеренно НЕ входит:
  # эталоны сняты на dev-сервере, а прод-сборка даёт другую высоту
  # страницы (нет dev-оверлея Next — расхождение 8 px), и шрифты
  # CI-образа отличаются от серверных. Эталоны остаются локальной
  # проверкой сопровождения (`С-10`).
  #
  # Приложение поднимается прод-сборкой, а не `next dev`: маршруты уже
  # собраны, поэтому нет таймаутов первого захода — 290 проверок
  # проходят за ~4 минуты вместо часа.
  #
  # Самая дорогая работа конвейера (~7 минут): ставит браузер, собирает прод и
  # поднимает сервер. Гоняется только когда менялись экраны — правка сервиса
  # или документа их вида не меняет.
  e2e-rules:
    name: e2e · правила экранов
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: scope
    if: github.event_name != 'push' && needs.scope.outputs.ui == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cabinet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Экраны «Здоровье системы», «Обмен» и админский дашборд читают состояние
      # очередей. С мёртвым адресом Redis страница висит на переподключении:
      # четыре таких экрана не открывались даже за 120 секунд. Живой Redis
      # дешевле, чем исключать экраны из проверки.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cabinet
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cabinet
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-32
      APP_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      ONE_C_ADAPTER: fake
      # Прод-сборка валидирует окружение строго (`У-132`, серия R0): без этих
      # переменных `next start` не поднимается вовсе. Значения — заглушки для
      # CI, не секреты.
      # NODE_ENV здесь НЕ задаём: с ним `npm ci` пропускает devDependencies и
      # падает на `prepare` («husky: not found»). Прод-режим включает сам
      # `next start`.
      #
      # Заглушки REDIS_URL и S3_* тоже НЕ здесь, а только на шаге запуска
      # сервера. Заданный, но мёртвый адрес хуже отсутствующего: `prisma:seed`
      # транзитивно тянет прод-код (клиенты очередей и хранилища), и с
      # `redis://localhost:6379`, за которым никого нет, он бесконечно
      # переподключается — job висел все 30 минут именно на seed, а не на
      # браузерных проверках. Без переменной клиент не создаётся вовсе.
      # Кабинеты — opt-in флаги; экраны под ними должны быть живыми.
      FEATURE_ORGANIZATION_CABINET: '1'
      FEATURE_MANAGER_CABINET: '1'
      FEATURE_LEADER_CABINET: '1'
      # Сервер уже поднят шагом ниже — конфиг Playwright не поднимает свой.
      PLAYWRIGHT_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      # Учётки шести ролей, которыми входит auth.setup, приходят из seed.
      - run: npm run prisma:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Поднять приложение
        # Без новой зависимости: ждём готовности обычным опросом. Две
        # минуты с запасом — прод-сборка стартует за секунды.
        env:
          # Строгая валидация окружения в production (`src/lib/env.ts`, `У-132`,
          # серия R0) требует эти переменные — без любой сервер не поднимется.
          # Значения — заглушки; сервисов за ними нет, но сервер к ним и не
          # ходит: браузерные проверки читают экраны, а не очередь и хранилище.
          HEALTH_TOKEN: ci-only-health-token-not-a-real-secret-32
          APP_ENCRYPTION_KEY: ci-only-encryption-key-32-bytes!
          REDIS_URL: redis://localhost:6379
          S3_BUCKET: ci-only-bucket
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: ci-only-access-key
          S3_SECRET_ACCESS_KEY: ci-only-secret-key
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/login; then
              echo "приложение готово (попытка $i)"
              exit 0
            fi
            sleep 2
          done
          echo "приложение не поднялось за 120 секунд" >&2
          exit 1
      - name: Правила экранов и мобильный каркас
        # Таймаут вдвое больше конфигурационного: раннер GitHub (2 ядра)
        # медленнее стенда, и тяжёлые админские экраны (журнал аудита, доступ
        # к ПДн, интеграции) не успевали открыться за 60 секунд — семь проверок
        # падали по `page.goto`, хотя на сервере те же экраны открываются за
        # секунды. Локальный конфиг не трогаем: там 60 секунд — разумная
        # граница, за которой начинается настоящая проблема.
        run: npx playwright test --grep "Правила экранов|каркас" --timeout=120000
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          # Было 7 дней. Артефакты приватного репозитория тратят платное
          # хранилище так же, как минуты, — трёх дней хватает, чтобы разобрать
          # упавший прогон.
          retention-days: 3
