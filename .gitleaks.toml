# Конфиг gitleaks (фаза 4). Базовые правила — дефолтные; ниже — allowlist
# ложных срабатываний, проверенных вручную при внедрении (48 находок, все —
# плейсхолдеры/тестовые значения, настоящих секретов нет):
#  - .env*.example — значения вида replace_with_…;
#  - docs/superpowers/plans/** — учебные примеры env-блоков в планах;
#  - src/__tests__/** — тестовые JWT/health-токены (…-test-secret-…).
# Новые пути сюда добавлять ТОЛЬКО после ручной проверки, что это не секрет.

[extend]
useDefault = true

[allowlist]
description = "Проверенные ложные срабатывания (плейсхолдеры и тестовые значения)"
paths = [
  '''^\.env(\.production)?\.example$''',
  '''^docs/superpowers/plans/.*\.md$''',
  '''^src/__tests__/.*''',
]
