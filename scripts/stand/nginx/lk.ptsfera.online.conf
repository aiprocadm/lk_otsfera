# Тестовый стенд: lk_otsfera и его хранилище файлов. См. docs/runbook-test-stand.md.
# Ставится в /etc/nginx/sites-available/, включается симлинком в sites-enabled/.
#
# Это состояние ДО выпуска сертификата. Certbot допишет сюда блоки HTTPS (443)
# и редирект с 80 — после этого файл нельзя перезаписывать целиком, только
# точечно править (иначе дописанное certbot пропадёт и HTTPS отвалится).

# --- Приложение ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lk.ptsfera.online;

    # Пароль на входе. Приложение хранит вход в cookie, поэтому с его
    # собственной авторизацией это не конфликтует.
    #
    # Realm ТОЛЬКО ЛАТИНИЦЕЙ: по RFC 7230/7235 в значении заголовка допустим
    # лишь ASCII. С кириллицей Chrome и Яндекс.Браузер молча отказываются
    # показать окно пароля — сайт просто не открывается, хотя curl и внешние
    # проверялки исправно получают 401 и всё выглядит здоровым.
    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/.htpasswd-stand;

    # DOCUMENT_MAX_FILE_SIZE_MB=200 в .env.production
    client_max_body_size 200m;

    # Робот Let's Encrypt приходит сюда проверять, что домен наш. Пароль для
    # него надо снять, иначе он получит отказ и сертификат не выпустится
    # (и не продлится через 3 месяца).
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Без X-Forwarded-Proto Next.js считает, что работает по http,
        # и secure-cookie не установится — вход перестанет работать.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Для чата и живых обновлений (websocket).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- Хранилище файлов (MinIO) -------------------------------------------
# Ссылки на скачивание подписываются адресом из S3_ENDPOINT, поэтому заголовок
# Host обязан доходить до MinIO без изменений — иначе подпись не сойдётся и
# файлы будут отдавать ошибку доступа.
#
# Пароля на входе здесь НЕТ намеренно: MinIO проверяет свою подпись через тот же
# заголовок Authorization, и basic-auth его бы вытеснил. Ссылки и так временные
# и неугадываемые.
server {
    listen 80;
    listen [::]:80;
    server_name s3.ptsfera.online;

    client_max_body_size 200m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Большие файлы отдаём потоком, не буферизуя на диск.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
